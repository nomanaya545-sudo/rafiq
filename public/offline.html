<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F766E" />
    <title>رفيق — غير متصل بالإنترنت</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
        background: linear-gradient(180deg, #f0fdfa 0%, #f8fafc 100%);
        color: #0f172a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
      }
      .badge {
        display: inline-block;
        font-size: 13px;
        font-weight: 700;
        color: #0f766e;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.4;
      }
      p {
        margin: 0 0 20px;
        font-size: 15px;
        line-height: 1.7;
        color: #475569;
      }
      .btn {
        display: inline-block;
        background: #0f766e;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        font-size: 15px;
        padding: 12px 24px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">تطبيق رفيق التعليمي</div>
      <h1>أنت غير متصل بالإنترنت حالياً</h1>
      <p>
        تعذّر تحميل هذه الصفحة لأن الاتصال بالإنترنت غير متاح. يمكنك العودة إلى الصفحة الرئيسية
        لتجربة المحتوى الثابت المخزّن محلياً فقط، علماً أن الميزات السحابية المستقبلية تتطلب اتصالاً
        بالإنترنت.
      </p>
      <a href="/" class="btn">العودة إلى الرئيسية</a>
    </main>
  </body>
</html>
